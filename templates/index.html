<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezervacije – {{ klub }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:13px;background:#f0f0f0;color:#222}
#hdr{background:#1a5276;color:#fff;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
#hdr .logo{font-size:18px;font-weight:bold}
#hdr .sub{font-size:12px;opacity:.8}
#info{background:#d5e8f7;border-bottom:1px solid #b0cce0;padding:5px 14px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 24px}
#info a{color:#1a5276;text-decoration:none}
#lbar{background:#eaf3fb;border-bottom:1px solid #cde0f0;padding:6px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
#lbar input{border:1px solid #aac;padding:3px 6px;border-radius:3px;font-size:12px;width:160px}
.btn{display:inline-block;padding:4px 12px;border:none;border-radius:3px;cursor:pointer;font-size:12px}
.btn-blue{background:#1a5276;color:#fff}.btn-blue:hover{background:#154360}
.btn-red{background:#922b21;color:#fff}.btn-red:hover{background:#7b241c}
#lerr{color:#c0392b;font-size:12px}
.uinfo{color:#1e8449;font-weight:bold}
#dnav{background:#1a5276;color:#fff;display:flex;align-items:center;justify-content:center;gap:18px;padding:7px 14px;font-size:14px}
.arr{cursor:pointer;font-size:22px;user-select:none;padding:0 6px}.arr:hover{opacity:.7}
#dlbl{font-weight:bold;min-width:230px;text-align:center}
.btn-today{background:#2e86c1;border:none;color:#fff;padding:3px 12px;border-radius:3px;cursor:pointer;font-size:12px}
#twrap{overflow-x:auto;padding:10px 6px 16px}
table.sc{border-collapse:collapse;min-width:700px;width:100%}
table.sc th,table.sc td{border:1px solid #bcd;padding:4px 6px;text-align:center;white-space:nowrap;font-size:12px}
tr.rdate th{background:#1a5276;color:#fff;font-size:13px;padding:6px}
tr.rcourt th{background:#2e86c1;color:#fff;font-weight:bold}
th.tc,td.tc{background:#dce8f5;font-weight:bold;color:#1a5276;min-width:110px}
tr.rcourt th.tc{background:#1a5276}
tfoot tr.rcourt td{background:#2e86c1;color:#fff;font-weight:bold}
tfoot tr.rcourt td.tc{background:#1a5276}
td.sl{min-width:72px;transition:filter .12s}
td.sl.free{background:#d4efdf;color:#1e8449;font-weight:bold;cursor:pointer}
td.sl.taken{background:#fadbd8;color:#922b21;font-weight:bold}
td.sl.sub{background:#fdebd0;color:#935116;font-weight:bold}
td.sl.past{background:#e8e8e8;color:#999;font-style:italic}
td.sl.free:hover{filter:brightness(.92)}
#leg{display:flex;gap:14px;flex-wrap:wrap;padding:6px 14px 12px;font-size:12px;align-items:center}
.lb{display:inline-block;width:14px;height:14px;border:1px solid #aaa;vertical-align:middle;margin-right:4px;border-radius:2px}
#load{text-align:center;padding:30px;color:#666;font-style:italic;display:none}

/* Klijenti sekcija */
#klijenti-wrap{padding:0 6px 20px;display:none}
.card{background:#fff;border-radius:6px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:14px}
.card h3{font-size:13px;color:#1a5276;margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:6px}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.fr label{font-size:12px;color:#555;display:block;margin-bottom:3px}
.fr input{border:1px solid #aac;padding:5px 8px;border-radius:3px;font-size:12px;width:200px}
.tbl{border-collapse:collapse;width:100%}
.tbl th{background:#2e86c1;color:#fff;padding:7px 10px;text-align:left;font-size:12px}
.tbl td{padding:6px 10px;border-bottom:1px solid #e8e8e8;font-size:12px}
.tbl tr:hover td{background:#f5f9ff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;cursor:pointer}
.badge-pret{background:#fdebd0;color:#935116}
.badge-reg{background:#e8e8e8;color:#666}
.msg-ok{color:#1e8449;font-size:12px;margin-top:6px}
.msg-err{color:#c0392b;font-size:12px;margin-top:6px}

/* Modal */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.ov.on{display:flex}
.mod{background:#fff;border-radius:6px;padding:22px 28px;max-width:420px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,.22)}
.mod h3{margin-bottom:14px;color:#1a5276}
.mod p{margin-bottom:8px;font-size:13px}
.minfo{background:#f0f4f8;border-radius:4px;padding:10px 14px;margin-bottom:14px;font-size:13px;line-height:1.8}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.bc{background:#1a5276;color:#fff;border:none;padding:6px 18px;border-radius:4px;cursor:pointer;font-size:13px}
.bc:hover{background:#154360}
.bx{background:#e8e8e8;color:#333;border:none;padding:6px 18px;border-radius:4px;cursor:pointer;font-size:13px}
.mok{color:#1e8449;font-weight:bold;margin-top:8px;font-size:13px}
.merr{color:#c0392b;font-weight:bold;margin-top:8px;font-size:13px}

/* Autocomplete */
.ac-wrap{position:relative}
.ac-wrap input{width:100%;border:1px solid #aac;padding:6px 10px;border-radius:3px;font-size:13px}
.ac-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #aac;border-radius:3px;margin-top:2px;z-index:200;max-height:200px;overflow-y:auto}
.ac-item{padding:8px 12px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0}
.ac-item:hover{background:#f0f4f8}
.ac-tag{font-size:11px;background:#fdebd0;color:#935116;padding:2px 7px;border-radius:10px}
.selected-klijent{display:none;margin-top:6px;align-items:center;gap:6px;flex-wrap:wrap}
.sel-name{background:#d5e8f7;color:#1a5276;font-size:12px;padding:3px 10px;border-radius:10px;font-weight:bold}
.sel-pret{background:#fdebd0;color:#935116;font-size:11px;padding:2px 7px;border-radius:10px}
.sel-clear{background:none;border:none;cursor:pointer;color:#888;font-size:16px;line-height:1}

/* Status dugmad */
.status-btns{display:flex;gap:8px;margin-top:10px}
.sbtn{flex:1;padding:8px;border:1px solid #ddd;border-radius:4px;cursor:pointer;font-size:12px;text-align:center;font-weight:bold;transition:all .15s}
.sbtn.active-taken{background:#fadbd8;color:#922b21;border-color:#e59a9a}
.sbtn.active-sub{background:#fdebd0;color:#935116;border-color:#e5c990}
.sbtn.inactive{background:#f5f5f5;color:#888;border-color:#ddd}

#foot{text-align:center;padding:10px;font-size:11px;color:#777;border-top:1px solid #ddd}
#foot a{color:#1a5276}
</style>
</head>
<body>

<div id="hdr">
  <div><div class="logo">🎾 {{ klub }}</div><div class="sub">Rezervacije termina</div></div>
  <div id="admin-link-wrap"></div>
</div>

<div id="info">
  <span>Rezerviši ili otkaži telefonom: <a href="tel:{{ tel }}"><strong>{{ tel }}</strong></a></span>
  <span id="mylink"></span>
</div>

<div id="lbar">
  <span>Prijavite se da rezervišete:</span>
  <input type="email" id="iem" placeholder="E-Mail" onkeydown="if(event.key==='Enter')login()">
  <input type="password" id="ipw" placeholder="Lozinka" onkeydown="if(event.key==='Enter')login()">
  <button class="btn btn-blue" onclick="login()">Prijava</button>
  <span id="lerr"></span>
</div>

<div id="dnav">
  <span class="arr" onclick="chDate(-1)">&#9664;</span>
  <button class="btn-today" onclick="goToday()">Danas</button>
  <span id="dlbl"></span>
  <span class="arr" onclick="chDate(1)">&#9654;</span>
</div>

<div id="load">⏳ Učitavam...</div>
<div id="twrap">
  <table class="sc">
    <thead id="th"></thead>
    <tbody id="tb"></tbody>
    <tfoot id="tf"></tfoot>
  </table>
</div>

<div id="leg">
  <span><span class="lb" style="background:#d4efdf"></span>Slobodno</span>
  <span><span class="lb" style="background:#fadbd8"></span>Zauzeto</span>
  <span><span class="lb" style="background:#fdebd0"></span>Pretplata</span>
  <span><span class="lb" style="background:#e8e8e8"></span>Prošlo</span>
</div>

<!-- Klijenti sekcija -->
<div id="klijenti-wrap">
  <div style="padding:0 6px">
    <div class="card">
      <h3>➕ Dodaj novog klijenta</h3>
      <div class="fr">
        <div>
          <label>Ime i prezime</label>
          <input type="text" id="k-ime" placeholder="Npr. Marko Petrović">
        </div>
        <div>
          <label>Tip klijenta</label>
          <div style="display:flex;gap:6px;margin-top:2px">
            <button id="btn-reg" onclick="setTip('regular')" class="btn btn-blue" style="font-size:12px;padding:5px 12px">Regularni</button>
            <button id="btn-pret" onclick="setTip('pretplatnik')" class="btn" style="font-size:12px;padding:5px 12px;background:#e8e8e8;color:#555">Pretplatnik</button>
          </div>
        </div>
        <button class="btn btn-blue" onclick="dodajKlijenta()" style="padding:5px 16px">Dodaj</button>
      </div>
      <div id="k-msg"></div>
    </div>

    <div class="card">
      <h3>👥 Lista klijenata</h3>
      <div style="margin-bottom:10px">
        <input type="text" id="k-search" placeholder="Pretraži klijente..." oninput="renderKlijenti()" style="border:1px solid #aac;padding:5px 8px;border-radius:3px;font-size:12px;width:240px">
      </div>
      <table class="tbl">
        <thead><tr><th>Ime i prezime</th><th>Tip</th><th>Akcija</th></tr></thead>
        <tbody id="k-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal rezervacija -->
<div class="ov" id="mov">
  <div class="mod">
    <h3>Rezervacija termina</h3>
    <div id="minfo" class="minfo"></div>

    <div style="margin-bottom:12px">
      <label style="font-size:12px;color:#555;display:block;margin-bottom:6px">Ime klijenta</label>
      <div class="ac-wrap">
        <input type="text" id="ac-input" placeholder="Počni da kucaš ime..." oninput="acSearch(this.value)" autocomplete="off">
        <div class="ac-dropdown" id="ac-dd"></div>
      </div>
      <div class="selected-klijent" id="sel-k">
        <span class="sel-name" id="sel-name"></span>
        <span class="sel-pret" id="sel-pret" style="display:none">pretplatnik</span>
        <button class="sel-clear" onclick="clearSel()">×</button>
      </div>
    </div>

    <div>
      <label style="font-size:12px;color:#555;display:block;margin-bottom:6px">Status rezervacije</label>
      <div class="status-btns">
        <button id="sbtn-taken" class="sbtn active-taken" onclick="setStatus('taken')">Zauzeto</button>
        <button id="sbtn-sub" class="sbtn inactive" onclick="setStatus('sub')">Pretplata</button>
      </div>
    </div>

    <div id="mmsg"></div>
    <div class="mbtns">
      <button class="bx" onclick="closeM()">Zatvori</button>
      <button class="bc" id="mbtn" onclick="confirmRez()">Rezerviši</button>
    </div>
  </div>
</div>

<!-- Modal moje rezervacije -->
<div class="ov" id="myov">
  <div class="mod" style="max-width:520px">
    <h3>Moje rezervacije</h3>
    <div id="mylist" style="max-height:320px;overflow-y:auto;margin:10px 0;font-size:12px"></div>
    <div class="mbtns"><button class="bx" onclick="document.getElementById('myov').classList.remove('on')">Zatvori</button></div>
  </div>
</div>

<div id="foot">© {{ klub }}</div>

<script>
var S={{ start }}, E={{ end }};
var DANI=['nedjelja','ponedeljak','utorak','sreda','četvrtak','petak','subota'];
var MES=['januara','februara','marta','aprila','maja','juna','jula','avgusta','septembra','oktobra','novembra','decembra'];
var cd=new Date();cd.setHours(0,0,0,0);
cd=new Date(cd.getFullYear(),cd.getMonth(),cd.getDate());
var cu=null, ps=null, selKlijent=null, rezStatus='taken', klijentTip='regular';

function fd(d){return DANI[d.getDay()]+' '+d.getDate()+'. '+MES[d.getMonth()]+' '+d.getFullYear()+'.';}
function iso(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}
function fh(h){return String(h).padStart(2,'0')+':00 do '+String(h+1).padStart(2,'0')+':00';}

function api(url,data,method,cb){
  method=method||'GET';
  var o={method:method,credentials:'include'};
  if(method==='POST'){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(data);}
  fetch(url,o).then(function(r){return r.json();}).then(cb).catch(function(){});
}

async function apiAsync(url,data,method){
  method=method||'GET';
  var o={method:method,credentials:'include'};
  if(method==='POST'){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(data);}
  var r=await fetch(url,o);return r.json();
}

async function checkMe(){
  var r=await apiAsync('/api/me');
  if(r.ok&&r.user)setIn(r.user);
  else render();
}

function setIn(u){
  cu=u;
  document.getElementById('lbar').innerHTML=
    '<span class="uinfo">✓ Prijavljeni ste kao <strong>'+u.name+'</strong></span>'+
    '<button class="btn btn-red" onclick="logout()">Odjava</button>'+
    (u.role==='admin'?'<a href="/admin/" style="margin-left:8px;color:#1a5276;font-weight:bold">⚙ Admin panel</a>':'');
  document.getElementById('mylink').innerHTML='<a href="#" onclick="showMy();return false">📋 Moje rezervacije</a>';
  document.getElementById('klijenti-wrap').style.display='block';
  loadKlijenti();
  render();
}

async function login(){
  var em=document.getElementById('iem')&&document.getElementById('iem').value.trim();
  var pw=document.getElementById('ipw')&&document.getElementById('ipw').value;
  if(!em||!pw){if(document.getElementById('lerr'))document.getElementById('lerr').textContent='Unesite email i lozinku.';return;}
  var r=await apiAsync('/api/login',{email:em,password:pw},'POST');
  if(r.ok)setIn(r.user);
  else if(document.getElementById('lerr'))document.getElementById('lerr').textContent=r.error||'Greška.';
}

async function logout(){
  await apiAsync('/api/logout',{},'POST');
  cu=null;location.reload();
}

async function render(){
  var ds=iso(cd);
  document.getElementById('dlbl').textContent=fd(cd);
  document.getElementById('load').style.display='block';
  document.getElementById('tb').innerHTML='';
  var r=await apiAsync('/api/raspored?date='+ds);
  document.getElementById('load').style.display='none';
  if(!r.ok)return;
  var cs=r.courts,ids=Object.keys(cs);
  document.getElementById('th').innerHTML=
    '<tr class="rdate"><th class="tc">Teren</th><th colspan="'+ids.length+'">'+fd(cd)+'</th></tr>'+
    '<tr class="rcourt"><th class="tc"></th>'+ids.map(function(i){return '<th>'+cs[i].name+'</th>';}).join('')+'</tr>';
  var body='';
  for(var h=S;h<E;h++){
    body+='<tr><td class="tc">'+fh(h)+'</td>';
    for(var j=0;j<ids.length;j++){
      var id=ids[j],slot=cs[id].slots[h],st=slot.status;
      var lbl={free:'Slobodno',taken:'Zauzeto',sub:'Pretplata',past:'Prošlo'}[st]||st;
      if(slot.booked_by&&st==='taken')lbl='Zauzeto<br><small style="font-weight:normal;font-size:10px">'+slot.booked_by+'</small>';
      if(slot.booked_by&&st==='sub')lbl='Pretplata<br><small style="font-weight:normal;font-size:10px">'+slot.booked_by+'</small>';
      var cl=st==='free'&&cu?' onclick="openM(\''+id+'\',\''+cs[id].name+'\','+h+')"':'';
      body+='<td class="sl '+st+'"'+cl+'>'+lbl+'</td>';
    }
    body+='</tr>';
  }
  document.getElementById('tb').innerHTML=body;
  document.getElementById('tf').innerHTML='<tr class="rcourt"><td class="tc">Teren</td>'+ids.map(function(i){return '<td>'+cs[i].name+'</td>';}).join('')+'</tr>';
}

function chDate(d){cd=new Date(cd.getFullYear(),cd.getMonth(),cd.getDate()+d);render();}
function goToday(){var t=new Date();cd=new Date(t.getFullYear(),t.getMonth(),t.getDate());render();}

// ── Klijenti ──────────────────────────────────────────────────────────────────
var sviKlijenti=[];

function loadKlijenti(){
  api('/api/klijenti',null,'GET',function(r){
    if(r.ok){sviKlijenti=r.klijenti;renderKlijenti();}
  });
}

function renderKlijenti(){
  var q=(document.getElementById('k-search')||{value:''}).value.toLowerCase();
  var filtered=sviKlijenti.filter(function(k){return k.ime.toLowerCase().includes(q);});
  var body=document.getElementById('k-body');
  if(!body)return;
  if(!filtered.length){body.innerHTML='<tr><td colspan="3" style="text-align:center;padding:16px;color:#888">Nema klijenata.</td></tr>';return;}
  body.innerHTML=filtered.map(function(k){
    return '<tr>'+
      '<td>'+k.ime+'</td>'+
      '<td><span class="badge '+(k.pretplatnik?'badge-pret':'badge-reg')+'" onclick="promeniTip('+k.id+')" title="Klikni da promijeniš">'+(k.pretplatnik?'pretplatnik':'regularni')+'</span></td>'+
      '<td><button onclick="brisiK('+k.id+')" class="btn btn-red" style="font-size:11px;padding:2px 8px">Obriši</button></td>'+
    '</tr>';
  }).join('');
}

function setTip(t){
  klijentTip=t;
  document.getElementById('btn-reg').className='btn '+(t==='regular'?'btn-blue':'');
  document.getElementById('btn-reg').style.background=t==='regular'?'':'#e8e8e8';
  document.getElementById('btn-reg').style.color=t==='regular'?'':'#555';
  document.getElementById('btn-pret').className='btn';
  document.getElementById('btn-pret').style.background=t==='pretplatnik'?'#935116':'#e8e8e8';
  document.getElementById('btn-pret').style.color=t==='pretplatnik'?'#fff':'#555';
}

function dodajKlijenta(){
  var ime=(document.getElementById('k-ime')||{value:''}).value.trim();
  var msg=document.getElementById('k-msg');
  if(!ime){msg.innerHTML='<p class="msg-err">Unesite ime klijenta.</p>';return;}
  api('/api/dodaj_klijenta',{ime:ime,pretplatnik:klijentTip==='pretplatnik'},'POST',function(r){
    if(r.ok){
      document.getElementById('k-ime').value='';
      msg.innerHTML='<p class="msg-ok">✓ Klijent dodat!</p>';
      setTimeout(function(){msg.innerHTML='';},3000);
      loadKlijenti();
    } else msg.innerHTML='<p class="msg-err">'+r.error+'</p>';
  });
}

function brisiK(id){
  if(!confirm('Obrisati klijenta?'))return;
  api('/api/brisi_klijenta',{id:id},'POST',function(r){
    if(r.ok)loadKlijenti();
  });
}

function promeniTip(id){
  api('/api/promeni_klijenta',{id:id},'POST',function(r){
    if(r.ok)loadKlijenti();
  });
}

// ── Modal rezervacija ─────────────────────────────────────────────────────────
function openM(courtId,courtName,hour){
  if(!cu){alert('Prijavite se da rezervišete termin.');return;}
  ps={date:iso(cd),court:courtId,hour:hour};
  document.getElementById('minfo').innerHTML=
    '<strong>Teren:</strong> '+courtName+'<br>'+
    '<strong>Datum:</strong> '+fd(cd)+'<br>'+
    '<strong>Vreme:</strong> '+fh(hour);
  document.getElementById('mmsg').innerHTML='';
  document.getElementById('mbtn').style.display='';
  document.getElementById('ac-input').value='';
  document.getElementById('ac-dd').style.display='none';
  document.getElementById('sel-k').style.display='none';
  selKlijent=null;
  rezStatus='taken';
  document.getElementById('sbtn-taken').className='sbtn active-taken';
  document.getElementById('sbtn-sub').className='sbtn inactive';
  document.getElementById('mov').classList.add('on');
}

function closeM(){document.getElementById('mov').classList.remove('on');ps=null;}

function setStatus(s){
  rezStatus=s;
  document.getElementById('sbtn-taken').className='sbtn '+(s==='taken'?'active-taken':'inactive');
  document.getElementById('sbtn-sub').className='sbtn '+(s==='sub'?'active-sub':'inactive');
}

function acSearch(q){
  var dd=document.getElementById('ac-dd');
  if(!q){dd.style.display='none';return;}
  var filtered=sviKlijenti.filter(function(k){return k.ime.toLowerCase().includes(q.toLowerCase());});
  if(!filtered.length){dd.style.display='none';return;}
  dd.innerHTML=filtered.map(function(k){
    return '<div class="ac-item" onclick="selK('+k.id+')">'+
      '<span>'+k.ime+'</span>'+
      (k.pretplatnik?'<span class="ac-tag">pretplatnik</span>':'')+
    '</div>';
  }).join('');
  dd.style.display='block';
}

function selK(id){
  selKlijent=sviKlijenti.find(function(k){return k.id===id;});
  document.getElementById('ac-input').value=selKlijent.ime;
  document.getElementById('ac-dd').style.display='none';
  document.getElementById('sel-k').style.display='flex';
  document.getElementById('sel-name').textContent=selKlijent.ime;
  document.getElementById('sel-pret').style.display=selKlijent.pretplatnik?'inline':'none';
  if(selKlijent.pretplatnik)setStatus('sub');
}

function clearSel(){
  selKlijent=null;
  document.getElementById('ac-input').value='';
  document.getElementById('sel-k').style.display='none';
  setStatus('taken');
}

async function confirmRez(){
  if(!ps)return;
  var ime=selKlijent?selKlijent.ime:document.getElementById('ac-input').value.trim();
  if(!ime){document.getElementById('mmsg').innerHTML='<p class="merr">Unesite ime klijenta.</p>';return;}
  var r=await apiAsync('/api/rezervisi',{date:ps.date,court:ps.court,hour:ps.hour,status:rezStatus,name:ime},'POST');
  var m=document.getElementById('mmsg');
  if(r.ok){m.innerHTML='<p class="mok">✓ '+r.message+'</p>';document.getElementById('mbtn').style.display='none';render();}
  else m.innerHTML='<p class="merr">✗ '+r.error+'</p>';
}

async function showMy(){
  if(!cu)return;
  var r=await apiAsync('/api/admin/rezervacije');
  var html='';
  if(r.ok&&r.rezervacije.length){
    var mine=r.rezervacije.filter(function(x){return x.user_email===cu.email||cu.role==='admin';});
    if(!mine.length){html='<p style="color:#888">Nemate rezervacija.</p>';}
    else{
      html='<table style="width:100%;border-collapse:collapse"><tr style="background:#dce8f5"><th style="padding:4px 6px;border:1px solid #bcd">Datum</th><th style="padding:4px 6px;border:1px solid #bcd">Teren</th><th style="padding:4px 6px;border:1px solid #bcd">Vreme</th><th style="padding:4px 6px;border:1px solid #bcd">Akcija</th></tr>';
      for(var i=0;i<mine.length;i++){
        var b=mine[i];
        html+='<tr><td style="padding:4px 6px;border:1px solid #bcd">'+b.date+'</td><td style="padding:4px 6px;border:1px solid #bcd">'+b.court_name+'</td><td style="padding:4px 6px;border:1px solid #bcd">'+fh(parseInt(b.hour))+'</td><td style="padding:4px 6px;border:1px solid #bcd;text-align:center"><button onclick="otkaziM(\''+b.date+'\',\''+b.court_id+'\','+parseInt(b.hour)+')" style="background:#922b21;color:#fff;border:none;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:11px">Otkaži</button></td></tr>';
      }
      html+='</table>';
    }
  }else html='<p style="color:#888">Nemate rezervacija.</p>';
  document.getElementById('mylist').innerHTML=html;
  document.getElementById('myov').classList.add('on');
}

async function otkaziM(date,court,hour){
  if(!confirm('Otkazati ovu rezervaciju?'))return;
  var r=await apiAsync('/api/otkazi',{date:date,court:court,hour:hour},'POST');
  if(r.ok){showMy();render();}else alert(r.error);
}

document.getElementById('mov').addEventListener('click',function(e){if(e.target===this)closeM();});
document.getElementById('myov').addEventListener('click',function(e){if(e.target===this)document.getElementById('myov').classList.remove('on');});
document.addEventListener('click',function(e){
  var dd=document.getElementById('ac-dd');
  if(dd&&!dd.contains(e.target)&&e.target.id!=='ac-input')dd.style.display='none';
});

(async function(){await checkMe();})();
</script>
</body>
</html>
